# [F-5] #75. Alembic for the ledger schema, and nothing else. ADR 0020.
#
# No sqlalchemy.url: migrations/env.py takes the URL from migrate.py, or from
# DATABASE_URL when you run the `alembic` command yourself. Required, no
# default, and always this service's own role. Root CLAUDE.md has the commands.
[alembic]
script_location = %(here)s/migrations
# This directory and backend/, relative to this file and not the current
# directory, so `import shared` resolves as it does under pytest
# (`pythonpath = . ..`) and in the image (`PYTHONPATH=/app`).
prepend_sys_path = %(here)s %(here)s/..
path_separator = space
file_template = %%(rev)s_%%(slug)s
