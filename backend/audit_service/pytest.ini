[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# `..` is backend/, which puts the shared package on the path. The image
# mirrors this layout — shared/ sits beside the service directory there
# too — so an import that works here works in the container. [F-6] #76
pythonpath = . ..
testpaths = unit_test
addopts = -q --strict-markers
