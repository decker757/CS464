[pytest]
# `..` is backend/, so `import shared.security` resolves exactly as it does from
# a service. Not `.`: that would also make `security` importable on its own, a
# path no service uses.
pythonpath = ..
testpaths = unit_test
addopts = -q --strict-markers
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    # The environment's Starlette 1.10 deprecates httpx under its TestClient;
    # the realtime suite uses starlette.testclient too. Only this message.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
