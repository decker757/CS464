name: End-to-end

# [F-12] #199. The real frontend, in a real browser, against the whole backend
# stack. Each side's own suite fakes the other, so a field renamed on one side
# and still read on the other passes both of them; it fails here.
#
# Advisory for now: not a required check. If it becomes one, require the JOB
# ("e2e"), not the workflow, for the reason ci-backend.yml's header gives: a
# pull request the paths filter skips reports no status at all. Never mark
# `notify` required; it only runs on failure.
on:
  push:
    branches: [ "dev", "staging", "main" ]
    paths:
      - "frontend/**"
      - "backend/**"
      - "sql/**"
      - "docker-compose.yml"
      # The throwaway .env is built from it.
      - ".env.example"
      - ".github/workflows/e2e.yml"
      - ".github/workflows/notify-failure.yml"
  # Every pull request, whatever it targets, like the other two workflows.
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "sql/**"
      - "docker-compose.yml"
      # The throwaway .env is built from it.
      - ".env.example"
      - ".github/workflows/e2e.yml"
      - ".github/workflows/notify-failure.yml"

  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # The stack lives for this one job on the runner, so its credentials are
      # made here and never committed. Fills every blank in .env.example, which
      # is every value compose refuses to start without.
      - name: Write a throwaway .env
        run: |
          python3 - <<'EOF'
          import re
          import secrets

          template = open(".env.example").read()
          filled = re.sub(r"^(\w+)=$", lambda blank: f"{blank.group(1)}={secrets.token_urlsafe(48)}", template, flags=re.M)
          # #373. Deliberately not .env.example's 1000. The specs work their
          # expected credits out from the grant the ledger reports
          # (e2e/support/backend.ts::startingGrant), so a figure that only
          # holds at the default has to fail here rather than on somebody's
          # own stack. An awkward value, not a round one: at 1000 a spec that
          # typed "1,000.0000" would pass, and four of the checks this run
          # makes would also pass by accident at 10000, where "9,997.4687"
          # contains "997.4687". Raising it is free; lowering it below
          # LARGEST_SPEND stops the run in global setup.
          filled, swapped = re.subn(r"^STARTING_CREDITS=.*$", "STARTING_CREDITS=1234.5678", filled, flags=re.M)
          if swapped != 1:
              raise SystemExit("STARTING_CREDITS is no longer a line in .env.example: this run would prove nothing about #373")
          open(".env", "w").write(filled)
          EOF

      - name: Start the backend stack
        run: docker compose up -d --build --wait

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install the browser
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      # Builds and serves the frontend itself (playwright.config.ts), on the
      # default ports compose publishes the services on.
      - name: Run the end-to-end tests
        working-directory: ./frontend
        run: npm run e2e

      - name: Save the services' logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt

      - name: Upload the trace, report and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            frontend/playwright-report/
            frontend/test-results/
            compose-logs.txt
          retention-days: 7

  notify:
    needs: e2e
    if: failure()
    uses: ./.github/workflows/notify-failure.yml
    with:
      area: End-to-end
    secrets: inherit
