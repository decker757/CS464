# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "dev", "staging", "main" ]
  pull_request:
    branches: [ "dev", "staging", "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Single service for now. Switch to a matrix over backend/* when the
        # trading and ledger services land.
        working-directory: ./backend/auth_service

    # Same major version as docker-compose.yml. Tests run on Postgres rather
    # than SQLite so engine differences surface here, not in production.
    services:
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_USER: cs464
          # Named directly, so no init script is needed in CI.
          POSTGRES_DB: cs464_test
          # No password at all. This container lives for one job on the
          # runner's private network and is unreachable from outside it, so
          # trust auth removes the credential rather than committing one.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cs464 -d cs464_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Passwordless, matching POSTGRES_HOST_AUTH_METHOD above.
      TEST_DATABASE_URL: postgresql+asyncpg://cs464@localhost:5432/cs464_test
      # The boot check reads DATABASE_URL, which has no default by design.
      DATABASE_URL: postgresql+asyncpg://cs464@localhost:5432/cs464_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/auth_service/requirements*.txt

      # requirements-dev.txt pulls in requirements.txt, so this is one install.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Minted per run and never stored. Nothing it signs outlives the job, so
      # there is no key-shaped string to commit.
      - name: Generate a throwaway signing key
        run: |
          echo "JWT_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" \
            >> "$GITHUB_ENV"

      # No --if-present equivalent on purpose: a failing or missing test run
      # exits non-zero and fails the job.
      - name: Test
        run: pytest

      # Catches an import error or a bad settings default before deploy.
      - name: Verify the app boots
        run: python -c "from main import create_app; create_app()"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Clean, reproducible install from the lockfile.
      - name: Install dependencies
        run: npm ci

      # Runs only if a "lint" script exists; won't fail the build if there isn't one.
      - name: Lint
        run: npm run lint --if-present

      # No --if-present here on purpose: if there is no test script (or a test fails),
      # this step exits non-zero and the whole job fails. That is what enforces "tests must pass".
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  notify:
    needs: [backend, frontend]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      # GitHub context values are passed via env (not inlined into the script)
      # to avoid shell injection from branch names / actor. --data-urlencode
      # encodes the message safely; --fail makes a bad send show as a failed step.
      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ vars.TELEGRAM_TOPIC_ID }}
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Only send message_thread_id when a topic is configured; otherwise post to General.
          THREAD_ARG=()
          if [ -n "${TELEGRAM_TOPIC_ID}" ]; then
            THREAD_ARG=(--data-urlencode "message_thread_id=${TELEGRAM_TOPIC_ID}")
          fi
          curl -sS --fail \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            "${THREAD_ARG[@]}" \
            --data-urlencode "text=❌ CI failed on ${REF} by ${ACTOR}
          ${RUN_URL}"