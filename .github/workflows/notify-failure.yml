# Reusable failure notifier, called by ci-backend.yml and ci-frontend.yml.
#
# Lives in one file so the shell-injection guards and the topic handling are
# written once. Callers pass `area` so the message says what broke.

name: Notify failure

on:
  workflow_call:
    inputs:
      area:
        description: Which suite failed, e.g. backend or frontend.
        required: true
        type: string

jobs:
  telegram:
    runs-on: ubuntu-latest
    steps:
      # GitHub context values are passed via env (not inlined into the script)
      # to avoid shell injection from branch names / actor. --data-urlencode
      # encodes the message safely; --fail makes a bad send show as a failed step.
      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ vars.TELEGRAM_TOPIC_ID }}
          AREA: ${{ inputs.area }}
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Only send message_thread_id when a topic is configured; otherwise post to General.
          THREAD_ARG=()
          if [ -n "${TELEGRAM_TOPIC_ID}" ]; then
            THREAD_ARG=(--data-urlencode "message_thread_id=${TELEGRAM_TOPIC_ID}")
          fi
          curl -sS --fail \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            "${THREAD_ARG[@]}" \
            --data-urlencode "text=❌ ${AREA} CI failed on ${REF} by ${ACTOR}
          ${RUN_URL}"
