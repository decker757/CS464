name: Backend CI

# Runs only when backend code, or this workflow, changes. A frontend-only
# commit never starts this, and vice versa in ci-frontend.yml.
#
# Caveat if you later add branch protection: a workflow skipped by a paths
# filter never reports a status at all, so marking "Backend CI" a required
# check would leave frontend-only pull requests waiting forever. Require the
# JOB, not the workflow — and note the job names now carry the matrix value,
# so they read "test (auth_service, auth_svc)", "test (market_service,
# market_svc)", "test (audit_service, audit_svc)", "test (ledger_service,
# ledger_svc)" and "test (realtime_service, none)". Never mark `notify`
# required; it only runs on failure.
on:
  push:
    branches: [ "dev", "staging", "main" ]
    paths:
      - "backend/**"
      - "sql/**"
      - "docker-compose.yml"
      - ".github/workflows/ci-backend.yml"
      - ".github/workflows/notify-failure.yml"
  pull_request:
    branches: [ "dev", "staging", "main" ]
    paths:
      - "backend/**"
      - "sql/**"
      - "docker-compose.yml"
      - ".github/workflows/ci-backend.yml"
      - ".github/workflows/notify-failure.yml"

  # Allows running this workflow manually from the Actions tab, on any branch.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # One service failing should not hide the state of the other.
      fail-fast: false
      matrix:
        include:
          - service: auth_service
            role: auth_svc
          - service: market_service
            role: market_svc
          # [4.3] #15. Reads the shared audit log; owns no schema.
          - service: audit_service
            role: audit_svc
          # [F-1] #41. Owns the ledger schema, which sql/02-schemas.sql has
          # reserved since #67, so this job needs nothing the others do not.
          - service: ledger_service
            role: ledger_svc
          # [F-2] #42. The one service with no database at all: no role, no
          # schema, nothing in sql/. `none` is not a Postgres role — it is the
          # value the two database steps below skip on, spelled out rather than
          # left empty so the job name reads "test (realtime_service, none)"
          # instead of trailing a blank. This suite needs Redis instead.
          - service: realtime_service
            role: none

    defaults:
      run:
        working-directory: ./backend/${{ matrix.service }}

    # Same major version as docker-compose.yml. Tests run on Postgres rather
    # than SQLite so engine differences surface here, not in production.
    services:
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_USER: cs464
          # Named directly, so no init script is needed in CI.
          POSTGRES_DB: cs464_test
          # No password at all. This container lives for one job on the
          # runner's private network and is unreachable from outside it, so
          # trust auth removes the credential rather than committing one.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cs464 -d cs464_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # [F-2] #42. Used by one matrix leg and started for all five, because a
      # service container cannot be made conditional on a matrix value. It costs
      # a couple of seconds on the other four and it is not worth a second job
      # to avoid. Same major version as docker-compose.yml.
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Connects as the service's OWN role, never the superuser, so each suite
      # runs under the same grants as production and the cross-schema denial
      # tests are actually testing something. Passwordless, matching the trust
      # auth above.
      #
      # Each conftest prefers its own <SERVICE>_TEST_DATABASE_URL and falls
      # back to this, so one variable per job is enough.
      DATABASE_URL: postgresql+asyncpg://${{ matrix.role }}@localhost:5432/cs464_test

      # [4.3] #15. Set for every job, and actually used by two of them.
      #
      # The audit service's own suite connects with it, and so does the market
      # service's, because market_svc holds INSERT on audit.admin_actions and
      # no SELECT: a test that appends an entry cannot read it back over the
      # connection that wrote it, and has to come in as the reader instead.
      # Passwordless here, matching the trust auth above.
      AUDIT_TEST_DATABASE_URL: postgresql+asyncpg://audit_svc@localhost:5432/cs464_test

      # [F-2] #42. Read only by the realtime suite, which has no DATABASE_URL to
      # read instead. No password: this container lives for one job on the
      # runner's private network, the same reasoning as the trust auth above.
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/${{ matrix.service }}/requirements*.txt

      # requirements-dev.txt pulls in requirements.txt, so this is one install.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # A service container cannot mount init scripts the way compose does, so
      # apply the same files by hand. Running the real sql/ means CI exercises
      # the actual grants rather than a simplified copy that could drift.
      # Passwords are ignored under trust auth but the files still expect them.
      # Skipped for realtime_service, which holds no role and owns no schema.
      # Running them would still succeed — they are idempotent and do not depend
      # on the matrix leg — but a job that sets up a database it never opens is
      # a job that reads as though it might.
      - name: Apply roles, schemas and grants
        if: matrix.role != 'none'
        working-directory: .
        env:
          ADMIN_URL: postgresql://cs464@localhost:5432/cs464_test
        run: |
          psql -v ON_ERROR_STOP=1 "$ADMIN_URL" \
            -v auth_password=unused \
            -v ledger_password=unused \
            -v market_password=unused \
            -v audit_password=unused \
            -f sql/01-roles.sql
          psql -v ON_ERROR_STOP=1 "$ADMIN_URL" \
            -v db_name=cs464_test -f sql/02-schemas.sql

      # Minted per run and never stored. Nothing it signs outlives the job, so
      # there is no key-shaped string to commit.
      - name: Generate a throwaway signing key
        run: |
          echo "JWT_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" \
            >> "$GITHUB_ENV"

      # No --if-present equivalent on purpose: a failing or missing test run
      # exits non-zero and fails the job.
      - name: Test
        run: pytest

      # Catches an import error or a bad settings default before deploy.
      #
      # PYTHONPATH, because this is the one step that does not go through
      # pytest: `pythonpath = . ..` in pytest.ini puts backend/ on the path for
      # the suite, and a bare `python -c` gets only the working directory. The
      # container sets the same variable to /app for the same reason. [F-6] #76
      - name: Verify the app boots
        env:
          PYTHONPATH: ..
        run: python -c "from main import create_app; create_app()"

  notify:
    needs: test
    if: failure()
    uses: ./.github/workflows/notify-failure.yml
    with:
      area: Backend
    secrets: inherit
