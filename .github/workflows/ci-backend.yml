name: Backend CI

# Runs only when backend code, or this workflow, changes. A frontend-only
# commit never starts this, and vice versa in ci-frontend.yml.
#
# Caveat if you later add branch protection: a workflow skipped by a paths
# filter never reports a status at all, so marking "Backend CI" a required
# check would leave frontend-only pull requests waiting forever. Either do
# not mark these required, or move the filtering into a job-level condition.
on:
  push:
    branches: [ "dev", "staging", "main" ]
    paths:
      - "backend/**"
      - "sql/**"
      - "docker-compose.yml"
      - ".github/workflows/ci-backend.yml"
      - ".github/workflows/notify-failure.yml"
  pull_request:
    branches: [ "dev", "staging", "main" ]
    paths:
      - "backend/**"
      - "sql/**"
      - "docker-compose.yml"
      - ".github/workflows/ci-backend.yml"
      - ".github/workflows/notify-failure.yml"

  # Allows running this workflow manually from the Actions tab, on any branch.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Single service for now. Switch to a matrix over backend/* when the
        # trading and ledger services land.
        working-directory: ./backend/auth_service

    # Same major version as docker-compose.yml. Tests run on Postgres rather
    # than SQLite so engine differences surface here, not in production.
    services:
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_USER: cs464
          # Named directly, so no init script is needed in CI.
          POSTGRES_DB: cs464_test
          # No password at all. This container lives for one job on the
          # runner's private network and is unreachable from outside it, so
          # trust auth removes the credential rather than committing one.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cs464 -d cs464_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Connects as auth_svc, not the superuser, so the suite runs under the
      # same grants as production. Passwordless, matching the trust auth above.
      TEST_DATABASE_URL: postgresql+asyncpg://auth_svc@localhost:5432/cs464_test
      # The boot check reads DATABASE_URL, which has no default by design.
      DATABASE_URL: postgresql+asyncpg://auth_svc@localhost:5432/cs464_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/auth_service/requirements*.txt

      # requirements-dev.txt pulls in requirements.txt, so this is one install.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # A service container cannot mount init scripts the way compose does, so
      # apply the same files by hand. Running the real sql/ means CI exercises
      # the actual grants rather than a simplified copy that could drift.
      # Passwords are ignored under trust auth but the files still expect them.
      - name: Apply roles, schemas and grants
        working-directory: .
        env:
          ADMIN_URL: postgresql://cs464@localhost:5432/cs464_test
        run: |
          psql -v ON_ERROR_STOP=1 "$ADMIN_URL" \
            -v auth_password=unused -v ledger_password=unused \
            -f sql/01-roles.sql
          psql -v ON_ERROR_STOP=1 "$ADMIN_URL" \
            -v db_name=cs464_test -f sql/02-schemas.sql

      # Minted per run and never stored. Nothing it signs outlives the job, so
      # there is no key-shaped string to commit.
      - name: Generate a throwaway signing key
        run: |
          echo "JWT_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" \
            >> "$GITHUB_ENV"

      # No --if-present equivalent on purpose: a failing or missing test run
      # exits non-zero and fails the job.
      - name: Test
        run: pytest

      # Catches an import error or a bad settings default before deploy.
      - name: Verify the app boots
        run: python -c "from main import create_app; create_app()"

  notify:
    needs: test
    if: failure()
    uses: ./.github/workflows/notify-failure.yml
    with:
      area: Backend
    secrets: inherit
