name: Frontend CI

# Runs only when frontend code, or this workflow, changes. See the caveat in
# ci-backend.yml before making this a required status check.
on:
  push:
    branches: [ "dev", "staging", "main" ]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
      - ".github/workflows/notify-failure.yml"
  # Every pull request, whatever it targets: a stacked PR targets the branch
  # below it, and would otherwise get no CI until that one merges.
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
      - ".github/workflows/notify-failure.yml"

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      # The frontend is not scaffolded yet (#46, #47, #48). Until package.json
      # exists there is nothing to install, lint, test or build, and failing on
      # its absence just trains everyone to ignore a red pipeline. Overrides the
      # job's working-directory, which does not exist yet either.
      - name: Is there a frontend yet?
        id: check
        working-directory: .
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No frontend/package.json yet, skipping the frontend suite."
          fi

      - name: Set up Node.js
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Clean, reproducible install from the lockfile.
      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: npm ci

      # Runs only if a "lint" script exists; won't fail the build if there isn't one.
      - name: Lint
        if: steps.check.outputs.exists == 'true'
        run: npm run lint --if-present

      - name: Type check
        if: steps.check.outputs.exists == 'true'
        run: |
          npx tsc --noEmit
          npx tsc --noEmit -p e2e

      # [F-11] #198. Unused files, exports and dependencies; config in knip.jsonc.
      - name: Dead code
        if: steps.check.outputs.exists == 'true'
        run: npm run knip

      # No --if-present here on purpose: if there is no test script (or a test fails),
      # this step exits non-zero and the whole job fails. That is what enforces "tests must pass".
      # [F-12] #342. The same run reports its coverage: `test:coverage` is
      # `vitest run` with the v8 provider, so this is not a second pass over
      # the suite. It reports and never gates — nothing fails on a low number.
      - name: Test
        if: steps.check.outputs.exists == 'true'
        run: npm run test:coverage

      - name: Add the figure to the run summary
        if: steps.check.outputs.exists == 'true'
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json

          total = json.load(open('coverage/coverage-summary.json'))['total']
          print('### Frontend test coverage')
          print()
          print('| Measure | Covered |')
          print('| --- | --- |')
          for measure in ('lines', 'statements', 'branches', 'functions'):
              counts = total[measure]
              print(f"| {measure} | {counts['pct']}% ({counts['covered']}/{counts['total']}) |")
          print()
          print('End-to-end tests are not counted: they drive a built bundle in a browser.')
          EOF

      - name: Build
        if: steps.check.outputs.exists == 'true'
        run: npm run build

  notify:
    needs: test
    if: failure()
    uses: ./.github/workflows/notify-failure.yml
    with:
      area: Frontend
    secrets: inherit
