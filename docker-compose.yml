# [5.1] #17 — the whole backend stack with one command.
# Every environment difference comes from the environment, nothing hardcoded.
#
#   docker compose up -d db       # just Postgres, for running tests on the host
#   docker compose up --build     # the full stack

name: cs464

services:
  db:
    image: postgres:17.2-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cs464}
      # Required. Empty or unset and compose refuses to start, rather than
      # falling back to a default. The guidance lives in this comment, not in
      # the value, so secret scanners read the line as a pure interpolation.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-cs464}
      # Consumed by sql/00-init.sh to create the per-service login roles.
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # The .sql files mount outside the init directory so the entrypoint does
      # not run them directly, without the variables they expect. The shim
      # applies them in order. First initialisation only: re-running means
      # `docker compose down -v`.
      - ./sql:/sql:ro
      - ./sql/00-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      # `auth` waits on this, so it never starts against a database that is
      # still initialising.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cs464} -d ${POSTGRES_DB:-cs464}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  auth:
    build:
      context: ./backend/auth_service
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Connects as auth_svc, not the superuser, so the grants in
      # sql/02-schemas.sql actually constrain this service.
      DATABASE_URL: postgresql+asyncpg://auth_svc:${AUTH_DB_PASSWORD}@db:5432/${POSTGRES_DB:-cs464}
      # Required, same as POSTGRES_PASSWORD above. Copy .env.example to .env
      # and fill both in.
      JWT_SECRET: ${JWT_SECRET:?}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "${AUTH_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  pgdata:
