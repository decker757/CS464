# [BE][5.5] #599. The five alert rules, in Grafana's alert-rule provisioning
# format. Import them into your Grafana Cloud stack: docs/deployment.md,
# "Monitoring: dashboard and alerts". The README lists the thresholds.
#
# Each rule is query A, the PromQL below, run as an instant query, and B, a
# threshold on A. Every A already compares, so it returns a series only while
# something is wrong, and B just says "A is above 0". No series is "no data":
# for four rules that means all is well (OK); for cs464-service-down it means
# every Alloy has gone silent (Alerting).
#
# `grafanacloud-prom` is the UID of a Grafana Cloud stack's own Prometheus
# datasource. On another stack, change it to that stack's UID.
apiVersion: 1
groups:
  - orgId: 1
    name: cs464
    folder: CS464
    interval: 1m
    rules:
      - uid: cs464-5xx-ratio
        title: More than 5% of a service's requests are failing
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: >-
                (sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
                / sum by (service) (rate(http_requests_total[5m])) > 0.05)
                and (sum by (service) (rate(http_requests_total[5m])) > 0.1)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "{{ $labels.service }}: more than 5% of requests answered 5xx for 5 minutes"
        labels:
          severity: page
        isPaused: false
        notification_settings:
          receiver: grafana-default-email

      - uid: cs464-p95-latency
        title: A service's p95 latency is over 1 second
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: >-
                (histogram_quantile(0.95, sum by (service, le)
                (rate(http_request_duration_seconds_bucket[5m]))) > 1)
                and (sum by (service) (rate(http_requests_total[5m])) > 0.1)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "{{ $labels.service }}: p95 latency over 1 s for 5 minutes"
        labels:
          severity: page
        isPaused: false
        notification_settings:
          receiver: grafana-default-email

      # The newest sweep across servers, and lag only from live sweepers: a
      # replica with CLOSE_SWEEP_ENABLED=false reports a lag of 0 and never
      # finishes a sweep, so it alone never fires this.
      - uid: cs464-close-sweep-behind
        title: The close sweep is behind
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: >-
                (time() - max(market_close_sweep_last_success_timestamp_seconds) > 60)
                or (max(market_close_sweep_lag_seconds
                and (time() - market_close_sweep_last_success_timestamp_seconds < 60)) > 60)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "No close sweep has finished in the last minute, or due markets have waited over a minute to close"
        labels:
          severity: page
        isPaused: false
        notification_settings:
          receiver: grafana-default-email

      # 1 for each service on each server that Alloy cannot scrape (up is 0)
      # or that has a dependency not ready, 0 otherwise. Written with `1 -`
      # rather than `== 0`, because `== 0` keeps the value 0, which the `> 0`
      # threshold would never fire on. The last arm is 1 for a pair seen in
      # the last hour and missing now: a server whose Alloy or droplet has
      # stopped sending. So "no data" really means no Alloy is sending at all.
      - uid: cs464-service-down
        title: A service is down, not ready, or has stopped sending
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: >-
                max by (service, server) (
                (1 - up{job="cs464"}) or (1 - service_dependency_ready))
                or (group by (service, server) (max_over_time(up{job="cs464"}[1h]))
                unless on (service, server) up{job="cs464"})
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        noDataState: Alerting
        execErrState: Error
        for: 3m
        annotations:
          summary: "{{ if $labels.service }}{{ $labels.service }} on {{ $labels.server }} cannot be scraped, is not ready, or has stopped sending metrics{{ else }}No server is sending metrics{{ end }}"
        labels:
          severity: page
        isPaused: false
        notification_settings:
          receiver: grafana-default-email

      - uid: cs464-login-limiter-off
        title: The login limiter is off
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              expr: sum(increase(auth_limiter_fail_open_total[5m])) > 0
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Redis was unreachable, so logins and registrations went through with no attempt limit"
        labels:
          severity: page
        isPaused: false
        notification_settings:
          receiver: grafana-default-email
