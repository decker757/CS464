# [5.4] #440. The load balancer in front of the replicated stack, for
# docker-compose.scale.yml. Not a production gateway: its whole job is to put
# two replicas of each service behind one address so that a round trip can be
# shown landing on different copies.
#
# One listener per service rather than one gateway with path prefixes. The
# services do not namespace their paths — /health and /docs are on all five,
# and both auth and the market service answer under /admin — so prefix routing
# would mean rewriting, while the frontend already addresses each service by
# its own URL (VITE_*_API_URL). A port per service keeps this a pure load
# balancer and changes nothing on either side of the contract.

user nginx;

# One worker, deliberately, and this is the one setting here worth reading.
# Round-robin state is per worker process, and every worker starts its cursor
# on the same upstream, so with `auto` on an eight-core laptop a handful of
# requests can all land on the same replica while twenty of them come back
# 13/7 — which looks exactly like a load balancer that is not balancing. One
# worker alternates strictly, and one worker is not a capacity question at
# this traffic: it is the backends that are being scaled here, not nginx.
worker_processes 1;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    # Which replica served each request. `$upstream_addr` is the replica's
    # address on the compose network; `docker inspect` maps it to a container
    # name, which is how the evidence in docs/horizontal-scaling.md was
    # collected.
    log_format replica '$time_iso8601 $status $request -> $upstream_addr';
    access_log /var/log/nginx/access.log replica;

    # The same thing in a response header, so a client can see for itself which
    # replica answered without reading the proxy's log. `always` is what puts it
    # on a WebSocket's 101 as well as on an ordinary response.
    add_header X-Served-By $upstream_addr always;

    # Each name below resolves once, when nginx starts, and every address it
    # returns is used in turn — which under `deploy.replicas` is one address per
    # replica. nginx does not re-resolve a name in an `upstream` on its own, so
    # a replica recreated with a new address needs `restart proxy` after it.
    # docker-compose.scale.yml waits for every replica to be healthy before
    # starting this container for the same reason.
    upstream auth_replicas     { server auth:8000; }
    upstream market_replicas   { server market:8000; }
    upstream audit_replicas    { server audit:8000; }
    upstream ledger_replicas   { server ledger:8000; }
    upstream realtime_replicas { server realtime:8000; }

    # A WebSocket handshake is an HTTP/1.1 request that asks to stop being one.
    # Without these three lines nginx answers the upgrade with a 200 and the
    # socket never opens. They are harmless on an ordinary request, where
    # $http_upgrade is empty and the map sends `Connection: close`.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A socket watching a quiet market sends nothing for minutes at a time, and
    # 60s — the default — would close it between trades. uvicorn pings every
    # 20s (realtime_service/Dockerfile), so this only has to outlast a ping.
    proxy_read_timeout 300s;

    server {
        listen 8000;
        location / { proxy_pass http://auth_replicas; }
    }

    server {
        listen 8001;
        location / { proxy_pass http://market_replicas; }
    }

    server {
        listen 8002;
        location / { proxy_pass http://audit_replicas; }
    }

    server {
        listen 8003;
        location / { proxy_pass http://ledger_replicas; }
    }

    server {
        listen 8004;
        location / { proxy_pass http://realtime_replicas; }
    }
}
