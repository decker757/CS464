# [5.3] #19. What one app server runs in production. Every app server runs
# this same file, and the DigitalOcean load balancer spreads requests across
# them. Postgres and Redis are managed services outside this file, which is why
# nothing here holds data: a server can be replaced at any time.
# docs/deployment.md has the whole picture.
#
# Compared with ../../docker-compose.yml: images come from the registry instead
# of being built here; there is no db or redis; nothing publishes a port except
# the gateway; the migrate steps run only when the deploy asks for them (ADR
# 0020); and the pool sizes are set, and the apps reach Postgres through
# DigitalOcean's connection pools (see below).
#
# Each release has its own copy of this file, in /opt/cs464/releases/<tag>/.
# roll.sh and migrate.sh read it with two env files:
#   /opt/cs464/app.env  secrets and this server's settings, shared by every
#                       release and rewritten by every deploy
#   release.env         IMAGE_TAG, this release's images, beside this file
# A setting's name in app.env is never renamed or removed, only added: the
# release before still reads the old name when a deploy goes back to it.

name: cs464

x-logging: &logging
  # Rotated, so a busy server cannot fill its disk with logs.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    # Names the compose service on every line, so Alloy can label the stream.
    labels: "com.docker.compose.service"

x-migrate: &migrate
  # Run only when named: `docker compose run --rm auth-migrate`. Once per
  # deploy, on one server, before any app is rolled. ADR 0020. Each connects
  # to Postgres directly, not through its service's pool. An app.env with no
  # direct address, from before the pools, falls back to the one it has.
  profiles: ["migrate"]
  command: ["python", "migrate.py"]
  # The image's HEALTHCHECK probes the API, which this container never serves.
  healthcheck:
    disable: true
  restart: "no"
  logging: *logging

x-app: &app
  restart: unless-stopped
  logging: *logging

x-app-environment: &app-environment
  # Only the gateway can reach the services, so the forwarded headers it
  # passes on can be trusted, and FastAPI builds https URLs from them.
  FORWARDED_ALLOW_IPS: "*"
  JWT_SECRET: ${JWT_SECRET:?}
  CORS_ORIGINS: https://${DOMAIN:?}
  # [BE][5.5] #599. Empty means no traces; release.sh sets both when Grafana
  # Cloud is configured.
  TRACING_ENDPOINT: ${TRACING_ENDPOINT:-}
  TRACING_SAMPLE_RATIO: ${TRACING_SAMPLE_RATIO:-1.0}

volumes:
  # Alloy's read positions in the container logs, so a restart resumes. Above
  # `services` because test/stack-test.sh appends a service to the file's end.
  alloy-data: {}

services:
  auth-migrate:
    <<: *migrate
    image: ${IMAGE_REGISTRY:?}/cs464-auth:${IMAGE_TAG:?}
    environment:
      DATABASE_URL: ${AUTH_DIRECT_DATABASE_URL:-${AUTH_DATABASE_URL:?}}

  market-migrate:
    <<: *migrate
    image: ${IMAGE_REGISTRY:?}/cs464-market:${IMAGE_TAG:?}
    environment:
      DATABASE_URL: ${MARKET_DIRECT_DATABASE_URL:-${MARKET_DATABASE_URL:?}}

  ledger-migrate:
    <<: *migrate
    image: ${IMAGE_REGISTRY:?}/cs464-ledger:${IMAGE_TAG:?}
    environment:
      DATABASE_URL: ${LEDGER_DIRECT_DATABASE_URL:-${LEDGER_DATABASE_URL:?}}

  # Pool sizes. Each service connects to its DigitalOcean pool, not to
  # Postgres, so these count client connections, which are cheap: a pool
  # takes thousands. The cap on Postgres is the pools' own, 38 in all,
  # however many servers run (infra/terraform/databases.tf). Per server:
  # auth 3+1, market 3+2, ledger 6+2, audit 1+1 = 19; three servers make 57
  # client connections onto those 38. The ledger's clients on three servers
  # (3 x 8 = 24) fit its pool of 24, so the pooler never queues the ledger
  # (#667). A trade waiting for a book lock still keeps its connection while
  # it waits, so the ledger lets only 2 trades per market, and 6 + 2 - 2 = 6
  # in all, hold one; the rest wait in memory, and 2 stay free for reads and
  # /ready. The slots are worked out from the ledger's two numbers below
  # (DATABASE_CONNECTIONS_PER_MARKET and DATABASE_CONNECTIONS_FOR_READS both
  # default to 2). docs/deployment.md, "Connection budget".
  auth:
    <<: *app
    image: ${IMAGE_REGISTRY:?}/cs464-auth:${IMAGE_TAG:?}
    environment:
      <<: *app-environment
      DATABASE_URL: ${AUTH_DATABASE_URL:?}
      DATABASE_POOL_SIZE: 3
      DATABASE_MAX_OVERFLOW: 1
      LEDGER_SERVICE_KEY: ${LEDGER_SERVICE_KEY:?}
      # [A-2] #600, ADR 0027. Login and registration limits; fails open.
      REDIS_URL: ${REDIS_URL:?}
      COOKIE_SECURE: "true"
      # The cookie is set by auth.<domain> and read by market., ledger.,
      # audit. and realtime.<domain>, so it names the parent domain. ADR 0002.
      COOKIE_DOMAIN: ${DOMAIN:?}

  market:
    <<: *app
    image: ${IMAGE_REGISTRY:?}/cs464-market:${IMAGE_TAG:?}
    environment:
      <<: *app-environment
      DATABASE_URL: ${MARKET_DATABASE_URL:?}
      DATABASE_POOL_SIZE: 3
      DATABASE_MAX_OVERFLOW: 2
      LEDGER_SERVICE_KEY: ${LEDGER_SERVICE_KEY:?}
      # Runs on every server. Two sweeps racing is safe: ADR 0011, and
      # docs/horizontal-scaling.md ran it.
      CLOSE_SWEEP_ENABLED: "true"

  ledger:
    <<: *app
    image: ${IMAGE_REGISTRY:?}/cs464-ledger:${IMAGE_TAG:?}
    environment:
      <<: *app-environment
      DATABASE_URL: ${LEDGER_DATABASE_URL:?}
      DATABASE_POOL_SIZE: 6
      DATABASE_MAX_OVERFLOW: 2
      LEDGER_SERVICE_KEY: ${LEDGER_SERVICE_KEY:?}
      REDIS_URL: ${REDIS_URL:?}
      # true on one server only, set per server in app.env. ADR 0021.
      LEADERBOARD_REFRESH_ENABLED: ${LEADERBOARD_REFRESH_ENABLED:?}
      # No MARKET_SERVICE_URL or AUTH_SERVICE_URL: their defaults name the
      # market and auth containers on this same server, which is right.

  audit:
    <<: *app
    image: ${IMAGE_REGISTRY:?}/cs464-audit:${IMAGE_TAG:?}
    environment:
      <<: *app-environment
      DATABASE_URL: ${AUDIT_DATABASE_URL:?}
      DATABASE_POOL_SIZE: 1
      DATABASE_MAX_OVERFLOW: 1

  realtime:
    <<: *app
    image: ${IMAGE_REGISTRY:?}/cs464-realtime:${IMAGE_TAG:?}
    environment:
      <<: *app-environment
      REDIS_URL: ${REDIS_URL:?}

  # The only container the load balancer can reach. It serves the frontend on
  # <domain>, and passes each service's subdomain on to that service.
  gateway:
    <<: *app
    image: ${IMAGE_REGISTRY:?}/cs464-gateway:${IMAGE_TAG:?}
    depends_on:
      auth:
        condition: service_healthy
      market:
        condition: service_healthy
      ledger:
        condition: service_healthy
      audit:
        condition: service_healthy
      realtime:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?}
    ports:
      # 80 on a server. The local test (test/stack-test.sh) picks a free port.
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      # roll.sh creates drain/on here to take this server out of the load
      # balancer before it changes anything. One folder for every release;
      # roll.sh sets DRAIN_DIR to its absolute path.
      - ${DRAIN_DIR:?}:/etc/nginx/drain:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/gateway-health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # [BE][5.5] #599. Metrics, logs and traces to Grafana Cloud. Started only
  # under the `observability` profile, which release.sh switches on when it is
  # given Grafana settings. Its settings are all optional here (never `:?`):
  # a server with Grafana off must still read this file.
  #
  # No Docker socket: it would hand a third-party container root on the host,
  # and the container logs are readable from the json-file directory instead.
  # No healthcheck: roll.sh's `up --wait` must never wait on Grafana, and
  # Alloy retries a Grafana it cannot reach rather than failing.
  alloy:
    <<: *app
    image: grafana/alloy:v1.21.3
    profiles: ["observability"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - alloy-data:/var/lib/alloy/data
    environment:
      SERVER_LABEL: ${SERVER_LABEL:-}
      GRAFANA_PROMETHEUS_URL: ${GRAFANA_PROMETHEUS_URL:-}
      GRAFANA_PROMETHEUS_USER: ${GRAFANA_PROMETHEUS_USER:-}
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL:-}
      GRAFANA_LOKI_USER: ${GRAFANA_LOKI_USER:-}
      GRAFANA_OTLP_URL: ${GRAFANA_OTLP_URL:-}
      GRAFANA_OTLP_USER: ${GRAFANA_OTLP_USER:-}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:-}
